<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliSTAR Weather Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="intellistar-container">
        <!-- Left Sidebar -->
        <div class="left-sidebar">
            <div class="location-header">
                <div class="location-name">FARMINGDALE</div>
                <div class="today-label">TODAY</div>
            </div>
            
            <div class="temperature-display">
                <div class="temp-value">88°</div>
            </div>
            
            <div class="weather-icon">
                <svg class="weather-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Sun -->
                    <circle cx="50" cy="35" r="20" fill="#FFD700"/>
                    <!-- Cloud -->
                    <path d="M 25 55 Q 25 45 35 45 Q 40 35 50 35 Q 60 35 65 45 Q 75 45 75 55 Z" fill="#E0E0E0"/>
                </svg>
            </div>
            
            <div class="condition-label">Partly Cloudy</div>
            
            <div class="map-container">
                <div class="map-placeholder">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M 30 30 Q 50 25 60 40 Q 70 55 50 70 Q 30 65 25 50 Z" fill="url(#mapGrad)"/>
                        <circle cx="50" cy="50" r="3" fill="#FF5722"/>
                    </svg>
                </div>
                <div class="map-label">FARMINGDALE</div>
            </div>
        </div>
        
        <!-- Main Weather Display -->
        <div class="main-display">
            <!-- Header -->
            <div class="display-header">
                <div class="header-badge">NOW</div>
                <div class="header-location">Farmingdale</div>
                <div class="header-condition">Sunny</div>
            </div>
            
            <!-- Large Sky Image Area -->
            <div class="sky-display">
                <div class="sun"></div>
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
            </div>
            
            <!-- Weather Details Bar -->
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">TEMP</div>
                    <div class="detail-value">87</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">HUMIDITY</div>
                    <div class="detail-value">49%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">WIND</div>
                    <div class="detail-value">SSW 14 MPH</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">GUSTS</div>
                    <div class="detail-value">None</div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="weather-channel-logo">
                <div class="logo-text">The Weather Channel</div>
            </div>
            <div class="website">weather.com</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
